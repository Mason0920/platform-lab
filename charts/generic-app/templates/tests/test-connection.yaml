{{- if and .Values.tests.enabled .Values.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "generic-app.fullname" . }}-test
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ .Values.tests.image | quote }}
      command:
        - wget
        - -q
        - -O-
        - -T
        - "5"
        - {{ printf "http://%s:%v%s" (include "generic-app.fullname" .) .Values.service.port .Values.tests.path | quote }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
{{- end }}
