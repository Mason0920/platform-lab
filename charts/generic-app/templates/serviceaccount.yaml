{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "generic-app.serviceAccountName" . }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
  {{- $ann := deepCopy (default dict .Values.serviceAccount.annotations) }}
  {{- with .Values.serviceAccount.irsaRoleArn }}
  {{- $_ := set $ann "eks.amazonaws.com/role-arn" . }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
