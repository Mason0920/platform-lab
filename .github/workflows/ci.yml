name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.2
  TERRAFORM_VERSION: 1.17.2
  TERRAGRUNT_VERSION: v1.2.2
  KUBECONFORM_VERSION: v0.8.0
  K8S_VERSION: 1.34.0

jobs:
  chart:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: make lint
        run: make lint K8S_VERSION=${K8S_VERSION}

  iac:
    name: terraform / terragrunt fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install terragrunt
        run: |
          curl -sSfL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: make fmt-check
        run: make fmt-check

      - name: terraform validate (kind-cluster module)
        working-directory: modules/kind-cluster
        run: |
          terraform init -backend=false -input=false
          terraform validate
